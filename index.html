<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rubica-assets</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3df; --accent:#2f5d8a; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 24px 12px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { margin:0 0 4px; font-size:18px; font-weight:600; }
  header p { margin:0; color:var(--muted); }
  header a { color:var(--accent); }
  .tools { display:flex; gap:12px; align-items:center; padding:12px 24px; flex-wrap:wrap; }
  input[type=search] { flex:1; min-width:220px; max-width:420px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:var(--card); }
  .count { color:var(--muted); }
  main { padding:0 24px 40px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:24px 0 10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .thumb { height:130px; display:flex; align-items:center; justify-content:center; background:
    repeating-conic-gradient(#ececea 0 25%, #fff 0 50%) 0 0 / 16px 16px; border-bottom:1px solid var(--line); }
  .thumb img { max-width:90%; max-height:90%; object-fit:contain; }
  .thumb .ext { font-weight:600; color:var(--muted); font-size:22px; }
  .meta { padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .name { font-weight:500; word-break:break-all; }
  .size { color:var(--muted); font-size:12px; }
  .btns { display:flex; gap:6px; }
  button { font:inherit; font-size:12px; padding:5px 8px; border:1px solid var(--line); background:var(--card); border-radius:5px; cursor:pointer; color:var(--ink); }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.done { background:var(--accent); color:#fff; border-color:var(--accent); }
  .empty { color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>rubica-assets</h1>
  <p>Public static assets. Click a button to copy the URL. See the <a href="https://github.com/rubica-au/rubica-assets#readme">README</a> for folder rules and how to publish.</p>
</header>
<div class="tools">
  <input type="search" id="q" placeholder="Filter by name or folder">
  <span class="count" id="count"></span>
</div>
<main id="main"><div class="empty">Loading…</div></main>
<script>
(async () => {
  const OWNER = 'rubica-au', REPO = 'rubica-assets', BRANCH = 'main';
  const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
  const PAGES = `https://${OWNER}.github.io/${REPO}/`;
  const IMG = /\.(png|jpe?g|gif|webp|svg|avif|ico)$/i;
  const SKIP = /^(\.|scripts\/|README|index\.html)/;
  const main = document.getElementById('main');
  const q = document.getElementById('q');
  const count = document.getElementById('count');
  let files = [];
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    files = j.tree.filter(t => t.type === 'blob' && !SKIP.test(t.path) && !t.path.endsWith('.gitkeep'));
  } catch (e) {
    main.innerHTML = `<div class="empty">Could not load the file list from GitHub (${e.message}). Browse the repo directly instead.</div>`;
    return;
  }
  const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(0) + ' KB' : (n/1048576).toFixed(1) + ' MB';
  function render() {
    const term = q.value.trim().toLowerCase();
    const shown = files.filter(f => f.path.toLowerCase().includes(term));
    count.textContent = `${shown.length} of ${files.length} files`;
    const groups = {};
    for (const f of shown) {
      const folder = f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : '(root, legacy)';
      (groups[folder] ||= []).push(f);
    }
    main.innerHTML = Object.keys(groups).sort().map(folder => `
      <h2>${folder}</h2>
      <div class="grid">${groups[folder].map(f => {
        const name = f.path.slice(f.path.lastIndexOf('/') + 1);
        const ext = name.slice(name.lastIndexOf('.') + 1).toUpperCase();
        const thumb = IMG.test(name) ? `<img src="${RAW + f.path}" alt="${name}" loading="lazy">` : `<span class="ext">${ext}</span>`;
        return `<div class="card">
          <div class="thumb">${thumb}</div>
          <div class="meta">
            <div class="name">${name}</div>
            <div class="size">${fmt(f.size)}</div>
            <div class="btns">
              <button data-url="${RAW + f.path}">Copy raw URL</button>
              <button data-url="${PAGES + f.path}">Copy pages URL</button>
            </div>
          </div>
        </div>`;
      }).join('')}</div>`).join('') || '<div class="empty">No matching files.</div>';
  }
  main.addEventListener('click', async e => {
    const b = e.target.closest('button[data-url]');
    if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.url); } catch { prompt('Copy this URL', b.dataset.url); return; }
    const old = b.textContent; b.textContent = 'Copied'; b.classList.add('done');
    setTimeout(() => { b.textContent = old; b.classList.remove('done'); }, 1200);
  });
  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
